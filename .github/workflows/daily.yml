{
"name": "每日機票監控",
"on": { "schedule": [ { "cron": "7 0 * * *" } ], "workflow_dispatch": {} },
"permissions": { "contents": "write" },
"jobs": { "watch": { "runs-on": "ubuntu-latest", "steps": [
{ "uses": "actions/checkout@v4" },
{ "uses": "actions/setup-python@v5", "with": { "python-version": "3.12" } },
{ "name": "抓價格並推播 LINE",
  "env": { "TRAVELPAYOUTS_TOKEN": "${{ secrets.TRAVELPAYOUTS_TOKEN }}", "LINE_CHANNEL_ACCESS_TOKEN": "${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}", "LINE_USER_ID": "${{ secrets.LINE_USER_ID }}" },
  "run": "python flight_watch.py" },
{ "name": "儲存價格歷史",
  "run": "git config user.name flight-watch-bot && git config user.email flight-watch-bot@users.noreply.github.com && git add data/ && (git diff --cached --quiet || git commit -m \"price history\") && git push" }
] } }
}
