{
"name": "每日機票監控",
"on": {
  "schedule": [ { "cron": "7 0 * * *" }, { "cron": "37 0 * * *" }, { "cron": "17 1 * * *" } ],
  "workflow_dispatch": { "inputs": { "mode": { "description": "daily=手動日報 / auto-daily=自動日報 / alert=錯價快報 / preview=預覽（不記錄已通知）", "required": false, "default": "daily" } } }
},
"permissions": { "contents": "write" },
"concurrency": { "group": "flight-watch", "cancel-in-progress": false },
"jobs": { "watch": { "runs-on": "ubuntu-latest", "steps": [
{ "uses": "actions/checkout@v4", "with": { "ref": "main" } },
{ "uses": "actions/setup-python@v5", "with": { "python-version": "3.12" } },
{ "name": "抓價格並推播 LINE",
  "env": { "TRAVELPAYOUTS_TOKEN": "${{ secrets.TRAVELPAYOUTS_TOKEN }}", "LINE_CHANNEL_ACCESS_TOKEN": "${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}", "LINE_USER_ID": "${{ secrets.LINE_USER_ID }}", "EVENT_SCHEDULE": "${{ github.event.schedule }}", "MODE": "${{ inputs.mode }}" },
  "run": "python flight_watch.py" },
{ "name": "儲存價格歷史", "if": "always()",
  "run": "git config user.name flight-watch-bot && git config user.email flight-watch-bot@users.noreply.github.com && git add data/ docs/ && (git diff --cached --quiet || git commit -m \"price history\") && git pull --rebase -X theirs && git push" }
] } }
}
