<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1d2129;--muted:#6b7280;--line:#e5e7eb;--accent:#1e88e5;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:0 auto}
h1{margin:0;font-size:22px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
main{max-width:1100px;margin:0 auto;padding:0 16px 40px}
h2{font-size:17px;margin:24px 0 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .hd{padding:8px 12px;color:#fff;font-weight:600;font-size:14px}
.card .bd{padding:10px 12px;flex:1}
.route{font-size:18px;font-weight:700}
.meta{color:var(--muted);font-size:12px}
.price{font-size:26px;font-weight:800;margin:4px 0 0}
.row{font-size:13px;margin-top:2px}
.warn{color:var(--hot);font-size:12px}
.card a.btn{display:block;text-align:center;margin:0 12px 12px;padding:8px;border-radius:8px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600;font-size:14px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border-radius:12px}
a{color:var(--accent)}
.empty{color:var(--muted);padding:12px 0}
footer{color:var(--muted);font-size:12px;max-width:1100px;margin:0 auto;padding:0 16px 32px}
</style>
</head>
<body>
<header>
  <h1>✈️ 機票雷達</h1>
  <div class="sub" id="sub"></div>
</header>
<main>
  <div class="tabs" id="tabs"></div>

  <h2>📉 今日降價（跟同航線同月份平常價比）</h2>
  <div class="grid" id="deals"></div>

  <section id="bizsec" hidden>
    <h2>💼 商務艙異常低價</h2>
    <div class="grid" id="biz"></div>
  </section>

  <section id="holsec" hidden>
    <h2>🇹🇼 連假精選（涵蓋整段連假）</h2>
    <div class="grid" id="hol"></div>
  </section>

  <h2>🗺 各地最低價（直飛來回）</h2>

    <tbody id="cheap"></tbody>
  </table></div>
</main>
<footer>

</footer>

days": ["齋戒月（約）"], "lcc_total": null, "low_sample": false, "n": null, "link": "https://www.skyscanner.com.tw/transport/flights/tpe/dxb/270217/270227/?preferdirects=true"}, {"from": "台北", "city": "布里斯本", "country": "澳洲", "region": "澳紐", "price": 28946, "base": 28914, "drop": -0.001, "tag": null, "airline": "CI", "airline_name": "華航", "flight": "053", "depart": "2027-02-15", "return": "2027-02-23", "days": 9, "leave": 7, "tw_holidays": [], "local_holidays": [], "lcc_total": null, "low_sample": false, "n": null, "link": "https://www.skyscanner.com.tw/transport/flights/tpe/bne/270215/270223/?preferdirects=true"}, {"from": "台北", "city": "奧克蘭", "country": "紐西蘭", "region": "澳紐", "price": 28978, "base": 41309, "drop": 0.299, "tag": null, "airline": "CI", "airline_name": "華航", "flight": "53", "depart": "2027-02-20", "return": "2027-03-02", "days": 11, "leave": 6, "tw_holidays": ["228連假"], "local_holidays": [], "lcc_total": null, "low_sample": false, "n": null, "link": "https://www.skyscanner.com.tw/transport/flights/tpe/akl/270220/270302/?preferdirects=true"}]};
const TAG_COLOR = {"🚨疑似錯價":"var(--err)","🔥大降價":"var(--hot)","📉比平常便宜":"var(--cheap)"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => "NT$" + Number(n).toLocaleString("en-US");
const md = s => s ? `${+s.slice(5,7)}/${+s.slice(8,10)}` : "";
const dates = d => md(d.depart) + (d.return ? "–" + md(d.return) : "") + (d.days ? `（${d.days}天）` : "");
let region = "全部";

$("sub").textContent = `更新時間：${DATA.updated}｜${DATA.min_days_ahead} 天後出發・直飛・台北／高雄出發`;

function regions() {
  const set = new Set();
  [...DATA.deals, ...DATA.cheapest].forEach(d => set.add(d.region));
  return ["全部", ...DATA.region_order.filter(r => set.has(r))];
}
function pass(d) { return region === "全部" || d.region === region; }

function extras(d) {
  let h = "";
  if (d.tw_holidays && d.tw_holidays.length) h += `<div class="row" style="color:var(--hol);font-weight:600">🇹🇼 含${esc(d.tw_holidays.join("、"))}，請假 ${d.leave} 天</div>`;
  else if (d.leave != null) h += `<div class="row">🗓 需請假 ${d.leave} 天</div>`;
  if (d.lcc_total) h += `<div class="row">🧳 廉航，含 20kg 行李約 ${money(d.lcc_total)}</div>`;
  if (DATA.party > 1) h += `<div class="row">👥 ${DATA.party} 人約 ${money((d.lcc_total || d.price) * DATA.party)}</div>`;
  (d.local_holidays || []).slice(0,1).forEach(x => h += `<div class="row">🎌 當地${esc(x)}</div>`);
  if (d.low_sample) h += `<div class="warn">⚠️ 樣本少（${d.n} 筆），請多比價</div>`;
  return h;
}

function dealCard(d) {
  return `<div class="card">
    <div class="hd" style="background:${TAG_COLOR[d.tag] || "#455a64"}">${esc(d.tag)}　便宜 ${Math.round(d.drop*100)}%</div>
    <div class="bd">
      <div class="route">${esc(d.from)} → ${esc(d.city)}</div>
      <div class="meta">${esc(d.country)}｜直飛來回</div>
      <div class="price" style="color:${TAG_COLOR[d.tag] || "inherit"}">${money(d.price)}</div>
      <div class="meta">此航線 ${+d.depart.slice(5,7)} 月平常約 ${money(d.base)}</div>
      <div class="row">✈️ ${esc(d.airline_name)} ${esc(d.airline)}${esc(d.flight)}</div>
      <div class="row">📅 ${dates(d)}</div>
      ${extras(d)}
    </div>
    <a class="btn" href="${esc(d.link)}" target="_blank" rel="noopener">Skyscanner 查看</a>
  </div>`;
}

function bizCard(d) {
  return `<div class="card">
    <div class="hd" style="background:var(--biz)">💼 商務艙</div>
    <div class="bd">
      <div class="route">${esc(d.from)} → ${esc(d.city)}</div>
      <div class="meta">${esc(d.country)}｜商務艙直飛來回</div>
      <div class="price" style="color:var(--biz)">${money(d.price)}</div>
      ${d.reasons.map(r => `<div class="row">・${esc(r)}</div>`).join("")}
      <div class="row">📅 ${dates(d)}</div>
    </div>
    <a class="btn" style="background:var(--biz)" href="${esc(d.link)}" target="_blank" rel="noopener">Skyscanner 查看</a>
  </div>`;
}

function holCard(h) {
  const rows = h.picks.filter(pass).map(d => `
      <div class="route" style="font-size:16px;margin-top:6px">${esc(d.from)} → ${esc(d.city)}（${esc(d.country)}）</div>
      <div class="row" style="color:var(--hol);font-weight:700">${money(d.price)}${d.lcc_total ? "（廉航）" : ""}　便宜 ${Math.round(d.drop*100)}%</div>
      <div class="meta">📅 ${md(d.depart)}–${md(d.return)}｜請假 ${d.leave} 天｜<a href="${esc(d.link)}" target="_blank" rel="noopener">查看</a></div>`).join("");
  if (!rows) return "";
  return `<div class="card"><div class="hd" style="background:var(--hol)">🇹🇼 ${esc(h.name)} ${md(h.start)}–${md(h.end)}</div><div class="bd">${rows}</div></div>`;
}

function cheapRow(d) {
  const base = d.base ? money(d.base) : "–";
  const drop = d.drop > 0.05 ? ` <span style="color:var(--cheap)">-${Math.round(d.drop*100)}%</span>` : "";
  return `<tr>
    <td><b>${esc(d.city)}</b> <span class="meta">${esc(d.country)}</span></td>
    <td>${esc(d.from)}</td>
    <td class="num"><b>${money(d.price)}</b>${drop}</td>
    <td class="num meta">${base}</td>
    <td>${dates(d)}</td>
    <td>${esc(d.airline_name)}${d.lcc_total ? " 🧳" : ""}</td>
    <td><a href="${esc(d.link)}" target="_blank" rel="noopener">查看</a></td>
  </tr>`;
}

function render() {
  $("tabs").innerHTML = regions().map(r => `<button class="${r === region ? "on" : ""}" data-r="${esc(r)}">${esc(r)}</button>`).join("");
  const deals = DATA.deals.filter(pass);
  $("deals").innerHTML = deals.length ? deals.map(dealCard).join("") : `<div class="empty">這個地區今天沒有明顯低於平常價格的直飛票。</div>`;
  const biz = DATA.business.filter(pass);
  $("bizsec").hidden = !biz.length;
  $("biz").innerHTML = biz.map(bizCard).join("");
  const hol = DATA.holidays.map(holCard).join("");
  $("holsec").hidden = !hol;
  $("hol").innerHTML = hol;
  const cheap = DATA.cheapest.filter(pass);
  $("cheap").innerHTML = cheap.length ? cheap.map(cheapRow).join("") : `<tr><td colspan="7" class="empty">沒有資料</td></tr>`;
}
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  region = b.dataset.r;
  render();
});
render();
</script>
